name: Create wheel

# started by the release scripts (exec_release.sh) once the GitHub release
# exists and the locally built sdist has been attached to it:
#
#   gh workflow run create-wheels.yaml --ref rel_X_Y_Z \
#       -f tag=rel_X_Y_Z -f sha256=<sha256 of the local sdist>
#
# the sdist is published first, then the wheels are built.  every file is
# uploaded to PyPI via trusted publishing with an attestation, so that the
# release has complete provenance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. rel_2_1_8"
        required: true
      sha256:
        description: "sha256 of the sdist attached to the GitHub release"
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  publish_sdist:
    name: publish sdist
    runs-on: ubuntu-latest
    steps:
      - name: Download sdist from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^rel_[0-9]+_[0-9]+_[0-9]+([a-z]+[0-9]+)?$ ]]; then
            echo "invalid tag: $TAG"
            exit 1
          fi
          version=$(echo "${TAG#rel_}" | tr _ .)
          sdist="sqlalchemy-${version}.tar.gz"
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$sdist" --dir dist
          # make sure this is exactly the file that was reviewed locally
          echo "${SHA256}  dist/${sdist}" | sha256sum --check -

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Publish sdist
        run: |
          python -m pip install pypi-attestations "twine>=6.2.0"
          python -m pypi_attestations sign ./dist/*
          python -m twine upload --skip-existing --attestations ./dist/*

  build_wheels:
    needs: publish_sdist
    name: ${{ matrix.wheel_mode }} wheels ${{ matrix.python }} on ${{ matrix.os }} ${{ matrix.os == 'ubuntu-22.04' && matrix.linux_archs || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # emulated wheels on linux take too much time, split wheels into multiple runs
        python:
          - "cp311-* cp312-*"
          - "cp313-* cp314-*"
          - "cp315-*"
          - "cp314t-* cp315t-*"
        wheel_mode:
          - compiled
        os:
          - "windows-2022"
          - "windows-11-arm"
          - "macos-15"
          - "ubuntu-22.04"
          - "ubuntu-22.04-arm"
        linux_archs:
          # this is only meaningful on linux. windows and macos ignore exclude all but one arch
          - "aarch64"
          - "x86_64"
          - "riscv64"

        include:
          # create pure python build
          - os: ubuntu-22.04
            wheel_mode: pure-python
            python: "cp-314*"

        exclude:
          - os: "windows-2022"
            linux_archs: "aarch64"
          # ignored on windows, just avoid to run it multiple times
          - os: "windows-11-arm"
            linux_archs: "aarch64"
          - os: "macos-15"
            linux_archs: "x86_64"
          - os: "ubuntu-22.04"
            linux_archs: "aarch64"
          - os: "ubuntu-22.04-arm"
            linux_archs: "x86_64"
          - os: "windows-2022"
            linux_archs: "riscv64"
          - os: "windows-11-arm"
            linux_archs: "riscv64"
          - os: "macos-15"
            linux_archs: "riscv64"
          - os: "ubuntu-22.04-arm"
            linux_archs: "riscv64"

      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # See details at https://cibuildwheel.readthedocs.io/en/stable/faq/#emulation
      - name: Set up QEMU
        if: matrix.linux_archs == 'riscv64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64

      - name: Build compiled wheels
        if: ${{ matrix.wheel_mode == 'compiled' }}
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
          CIBW_BUILD: ${{ matrix.python }}
          # setting it here does not work on linux
          # PYTHONNOUSERSITE: "1"


      - name: Set up Python for pure-python wheel
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build pure-python wheel
        if: ${{ matrix.wheel_mode == 'pure-python' && runner.os == 'Linux' }}
        run: |
          python -m pip install --upgrade pip
          pip --version
          pip install build
          pip list
          DISABLE_SQLALCHEMY_CEXT=y python -m build --wheel --outdir ./wheelhouse

      - name: Upload wheels to release
        # upload the generated wheels to the github release
        continue-on-error: true
        uses: sqlalchemyorg/upload-release-assets@sa
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ inputs.tag }}
          files: './wheelhouse/*.whl'

      # pypi-attestations can't be installed on windows-11-arm (no
      # cryptography wheels), so those wheels are handed to the
      # publish_windows_arm job below, which signs them on linux.  every
      # other job signs and uploads its own wheels, so that a failure in one
      # job doesn't hold back the others.  a wheel is never uploaded without
      # an attestation, since a file can't be re-uploaded later to add one;
      # if signing fails, the job fails and can be re-run.
      - name: Save windows-11-arm wheels for signing on linux
        if: ${{ matrix.os == 'windows-11-arm' }}
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          overwrite: true

      - name: Sign and publish wheels
        if: ${{ matrix.os != 'windows-11-arm' }}
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install pypi-attestations "twine>=6.2.0"
          python -m pypi_attestations sign ./wheelhouse/*
          python -m twine upload --skip-existing --attestations ./wheelhouse/*

  publish_windows_arm:
    name: sign and publish windows-11-arm wheels
    needs: build_wheels
    # publish whichever windows-11-arm wheels were built, even if some of the
    # other wheel jobs failed
    if: ${{ !cancelled() && needs.build_wheels.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download windows-11-arm wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-windows-arm-*
          merge-multiple: true
          path: ./wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Sign and publish wheels
        run: |
          shopt -s nullglob
          wheels=(./wheelhouse/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "no windows-11-arm wheels were built"
            exit 1
          fi
          python -m pip install pypi-attestations "twine>=6.2.0"
          python -m pypi_attestations sign "${wheels[@]}"
          python -m twine upload --skip-existing --attestations ./wheelhouse/*
