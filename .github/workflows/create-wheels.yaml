name: Create wheel

# started by the release scripts (exec_release.sh) once the GitHub release
# exists and the locally built sdist has been attached to it:
#
#   gh workflow run create-wheels.yaml --ref rel_X_Y_Z \
#       -f tag=rel_X_Y_Z -f sha256=<sha256 of the local sdist>
#
# the sdist is published first, then the wheels are built.  every file is
# uploaded to PyPI via trusted publishing with an attestation, so that the
# release has complete provenance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. rel_2_0_57"
        required: true
      sha256:
        description: "sha256 of the sdist attached to the GitHub release"
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  publish_sdist:
    name: publish sdist
    runs-on: ubuntu-latest
    steps:
      - name: Download sdist from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^rel_[0-9]+_[0-9]+_[0-9]+([a-z]+[0-9]+)?$ ]]; then
            echo "invalid tag: $TAG"
            exit 1
          fi
          version=$(echo "${TAG#rel_}" | tr _ .)
          sdist="sqlalchemy-${version}.tar.gz"
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$sdist" --dir dist
          # make sure this is exactly the file that was reviewed locally
          echo "${SHA256}  dist/${sdist}" | sha256sum --check -

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Publish sdist
        run: |
          python -m pip install pypi-attestations "twine>=6.2.0"
          python -m pypi_attestations sign ./dist/*
          python -m twine upload --skip-existing --attestations ./dist/*

  build_wheels:
    needs: publish_sdist
    name: ${{ matrix.wheel_mode }} wheels ${{ matrix.python }} on ${{ matrix.os }} ${{ matrix.os == 'ubuntu-22.04' && matrix.linux_archs || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # emulated wheels on linux take too much time, split wheels into multiple runs
        #
        # no wheels are built for python 3.7.  since October 2025, PyPI
        # rejects wheels whose filename does not start with the normalized
        # project name "sqlalchemy".  the setuptools / wheel versions that
        # install on python 3.7 name the wheel "SQLAlchemy-...", so no cp37
        # wheel has been accepted by PyPI since SQLAlchemy 2.0.44.  python
        # 3.7 installs use the sdist.
        #
        # cp38 is on its own as it's built with an older cibuildwheel
        python:
          - "cp38-*"
          - "cp39-* cp310-*"
          - "cp311-* cp312-*"
          - "cp313-* cp314-*"
          - "cp314t-*"
        wheel_mode:
          - compiled
        os:
          - "windows-2022"
          - "macos-15"
          - "ubuntu-22.04"
          - "ubuntu-22.04-arm"
        linux_archs:
          # this is only meaningful on linux. windows and macos ignore exclude all but one arch
          - "aarch64"
          - "x86_64"

        include:
          # create pure python build
          - os: ubuntu-22.04
            wheel_mode: pure-python
            python: "cp-313*"

        exclude:
          - os: "windows-2022"
            linux_archs: "aarch64"
          - os: "macos-15"
            linux_archs: "x86_64"
          - os: "ubuntu-22.04"
            linux_archs: "aarch64"
          - os: "ubuntu-22.04-arm"
            linux_archs: "x86_64"

      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Remove tag_build from setup.cfg
        # sqlalchemy has `tag_build` set to `dev` in setup.cfg. We need to remove it before creating the weel
        # otherwise it gets tagged with `dev0`
        shell: pwsh
        # This is equivalent to the sed commands:
        # `sed -i '/tag_build=dev/d' setup.cfg`
        # `sed -i '/tag_build = dev/d' setup.cfg`

        # `-replace` uses a regexp match
        # alternative form: `(get-content setup.cfg) | foreach-object{$_ -replace "tag_build.=.dev",""} | set-content setup.cfg`
        run: |
          (cat setup.cfg) | %{$_ -replace "tag_build.?=.?dev",""} | set-content setup.cfg

      # See details at https://cibuildwheel.readthedocs.io/en/stable/faq/#emulation
      # no longer needed since arm runners are now available
      # - name: Set up QEMU on linux
      #   if: ${{ runner.os == 'Linux' }}
      #   uses: docker/setup-qemu-action@v3
      #   with:
      #     platforms: all

      - name: Build compiled wheels
        if: ${{ matrix.wheel_mode == 'compiled' && matrix.python != 'cp38-*' }}
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
          CIBW_BUILD: ${{ matrix.python }}
          # setting it here does not work on linux
          # PYTHONNOUSERSITE: "1"

      # cibuildwheel 4 no longer builds python 3.8
      - name: Build compiled wheels 3.8
        if: ${{ matrix.wheel_mode == 'compiled' && matrix.python == 'cp38-*' }}
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
          CIBW_BUILD: ${{ matrix.python }}
          # setting it here does not work on linux
          # PYTHONNOUSERSITE: "1"


      - name: Set up Python for twine and pure-python wheel
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build pure-python wheel
        if: ${{ matrix.wheel_mode == 'pure-python' && runner.os == 'Linux' }}
        run: |
          python -m pip install --upgrade pip
          pip --version
          pip install build
          pip list
          DISABLE_SQLALCHEMY_CEXT=y python -m build --wheel --outdir ./wheelhouse

      - name: Upload wheels to release
        # upload the generated wheels to the github release
        uses: sqlalchemyorg/upload-release-assets@sa
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ inputs.tag }}
          files: './wheelhouse/*.whl'

      # a wheel is never uploaded without an attestation, since a file can't
      # be re-uploaded later to add one; if signing fails, the job fails and
      # can be re-run.
      - name: Sign and publish wheels
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install pypi-attestations "twine>=6.2.0"
          python -m pypi_attestations sign ./wheelhouse/*
          python -m twine upload --skip-existing --attestations ./wheelhouse/*
